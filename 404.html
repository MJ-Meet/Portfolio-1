<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Meet Jethawa</title>
  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .error-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .error-code {
      font-size: 7rem;
      font-weight: 900;
      font-family: var(--font-heading);
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="login-card" style="max-width: 500px;">
      <div class="error-code mb-2">404</div>
      <h3 class="fw-bold mb-2">Page Not Found</h3>
      <p class="text-muted mb-4">
        Oops! The page you are looking for doesn't exist, was removed, or had its URL changed.
      </p>
      <div class="d-flex gap-2 justify-content-center flex-wrap">
        <a href="index.html" class="btn btn-primary px-4">
          🏠 Return to Portfolio
        </a>
        <a href="admin.html" class="btn btn-outline-secondary px-4">
          ⚙️ Admin Portal
        </a>
      </div>
    </div>
  </div>
</body>
</html>
