<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <rect width="800" height="450" fill="url(#grid)" />

  <!-- Abstract AI Network Nodes -->
  <g stroke="#6366f1" stroke-opacity="0.3" stroke-width="1.5">
    <line x1="200" y1="140" x2="320" y2="225" />
    <line x1="320" y1="225" x2="480" y2="225" />
    <line x1="480" y1="225" x2="600" y2="140" />
    <line x1="320" y1="225" x2="400" y2="330" />
    <line x1="480" y1="225" x2="400" y2="330" />
    <line x1="200" y1="310" x2="400" y2="330" />
    <line x1="600" y1="310" x2="400" y2="330" />
  </g>

  <!-- Glowing Central Console Card -->
  <rect x="220" y="110" width="360" height="230" rx="20" fill="#0f172a" fill-opacity="0.9" stroke="url(#neonGrad)" stroke-width="2"/>

  <!-- Window Header -->
  <circle cx="250" cy="135" r="5" fill="#ef4444"/>
  <circle cx="266" cy="135" r="5" fill="#f59e0b"/>
  <circle cx="282" cy="135" r="5" fill="#10b981"/>
  <line x1="220" y1="155" x2="580" y2="155" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Code / AI Visualization Lines -->
  <rect x="250" y="180" width="160" height="10" rx="5" fill="#6366f1" fill-opacity="0.6"/>
  <rect x="250" y="202" width="260" height="8" rx="4" fill="#ffffff" fill-opacity="0.2"/>
  <rect x="250" y="220" width="210" height="8" rx="4" fill="#ffffff" fill-opacity="0.2"/>
  <rect x="250" y="238" width="190" height="8" rx="4" fill="#38bdf8" fill-opacity="0.5"/>

  <!-- Interactive Project Badge -->
  <g transform="translate(250, 270)">
    <rect width="130" height="34" rx="17" fill="url(#neonGrad)"/>
    <text x="65" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">AI PROJECT</text>
  </g>

  <!-- Network Node Dots -->
  <circle cx="200" cy="140" r="8" fill="#38bdf8"/>
  <circle cx="600" cy="140" r="8" fill="#818cf8"/>
  <circle cx="400" cy="330" r="8" fill="#a855f7"/>
  <circle cx="200" cy="310" r="6" fill="#34d399"/>
  <circle cx="600" cy="310" r="6" fill="#ec4899"/>
</svg>
