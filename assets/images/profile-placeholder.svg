<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="avatarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" rx="40" fill="url(#bgGrad)"/>

  <!-- Circuit & Tech Grid Lines -->
  <circle cx="250" cy="250" r="210" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="6,8"/>
  <circle cx="250" cy="250" r="170" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
  <circle cx="250" cy="250" r="130" fill="none" stroke="url(#glowGrad)" stroke-width="3"/>

  <!-- Glowing Aura -->
  <circle cx="250" cy="250" r="140" fill="url(#avatarGlow)"/>

  <!-- Central Modern Avatar Silhouette / Tech Badge -->
  <g filter="url(#shadow)">
    <!-- Base Circle -->
    <circle cx="250" cy="250" r="115" fill="#0f172a" />
    <circle cx="250" cy="250" r="110" fill="#1e293b" stroke="#6366f1" stroke-width="3"/>

    <!-- Stylized Head & Shoulders -->
    <!-- Head -->
    <circle cx="250" cy="205" r="44" fill="#f8fafc"/>
    <!-- Sleek Tech Glasses / Visor -->
    <rect x="222" y="195" width="56" height="15" rx="7" fill="#6366f1"/>
    <circle cx="236" cy="202" r="3" fill="#38bdf8"/>
    <circle cx="264" cy="202" r="3" fill="#38bdf8"/>

    <!-- Shoulders -->
    <path d="M 175 320 C 175 268, 325 268, 325 320 Z" fill="#f8fafc"/>
    <path d="M 215 275 L 250 315 L 285 275 Z" fill="#6366f1" fill-opacity="0.9"/>
  </g>

  <!-- Floating Tech Badges on Ring -->
  <g transform="translate(60, 90)">
    <rect width="80" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="40" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">PYTHON</text>
  </g>

  <g transform="translate(360, 90)">
    <rect width="70" height="32" rx="16" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
    <text x="35" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#818cf8" text-anchor="middle">AI / ML</text>
  </g>

  <g transform="translate(70, 380)">
    <rect width="70" height="32" rx="16" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
    <text x="35" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">DATA</text>
  </g>

  <g transform="translate(350, 380)">
    <rect width="80" height="32" rx="16" fill="#0f172a" stroke="#f472b6" stroke-width="1.5"/>
    <text x="40" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f472b6" text-anchor="middle">AGENTS</text>
  </g>

  <!-- Monogram Initials Bottom Badge -->
  <g transform="translate(205, 410)">
    <rect width="90" height="36" rx="18" fill="#4f46e5" stroke="#ffffff" stroke-width="2"/>
    <text x="45" y="24" font-family="system-ui, sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">MJ</text>
  </g>
</svg>
